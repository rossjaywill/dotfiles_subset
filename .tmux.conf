# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-sessionist'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'odedlaz/tmux-onedark-theme'
# set -g @plugin 'catppucin/tmux'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'roosta/tmux-fuzzback'
set -g @plugin 'laktak/extrakto'
set -g @plugin 'Morantron/tmux-fingers'
# set -g @plugin 'fcsonline/tmux-thumbs'
set -g @plugin 'soyuka/tmux-current-pane-hostname'

set -g @resurrect-strategy-vim 'session'
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-capture-pane-contents 'on'

TMUX_FZF_LAUNCH_KEY="C-t"
TMUX_FZF_OPTIONS="-p -h 40% -m"
set -g @fuzzback-fzf-layout 'reverse'
set -g @fuzzback-finder-layour 'reverse'
set -g @fuzzback-hide-preview 1
set -g @extrako-split-direction 'p'
set -g @extrako-split-size '50'
set -g @extrako-popup-size '40%'
set -g @extrakto_fzf_layout 'reverse'
# set -g @thumbs-key C-f
set -g @fingers-key C-f

# set -g @thumbs-bg-color "#303346"
# set -g @thumbs-hint-bg-color "#303346"
# set -g @thumbs-select-bg-color "#303346"
# set -g @thumbs-command 'tmux set-buffer -- {}'
# set -g @thumbs-upcase-command 'tmux set-buffer -- {} && tmux paste-buffer'
set -g visual-activity off
set -g visual-bell off
set -g visual-silence on

set -g prefix C-a
unbind-key C-b
bind-key C-a send-prefix

set -g default-terminal "xterm-ghostty"
# set -g default-terminal "tmux-256color"
# set -g default-terminal "screen-truecolor"
# set -sa terminal-overrides ",screen-256color:RGB"
# set -sa terminal-overrides ",*:Tc"
set-option -a terminal-overrides "xterm-ghostty:Tc"
# set-option -a terminal-features 'xterm-kitty:RGB'
# set -sa terminal-overrides ",*256col*:Tc"

setw -g history-limit 100000
set -sg status-interval 15
set -sg escape-time 0

setw -g mouse on
setw -g mode-keys vi
set -g status-keys vi

set -g base-index 1
setw -g pane-base-index 1

# preserve current panes' path when splitting
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

unbind-key C-v
bind-key -n C-b copy-mode

# copy mode selection/yank
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# vim nav
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"

bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' { if -F '#{pane_at_left}' '' 'select-pane -L' }
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' { if -F '#{pane_at_bottom}' '' 'select-pane -D' }
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' { if -F '#{pane_at_top}' '' 'select-pane -U' }
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' { if -F '#{pane_at_right}' '' 'select-pane -R' }

bind-key -T copy-mode-vi 'C-h' if -F '#{pane_at_left}' '' 'select-pane -L'
bind-key -T copy-mode-vi 'C-j' if -F '#{pane_at_bottom}' '' 'select-pane -D'
bind-key -T copy-mode-vi 'C-k' if -F '#{pane_at_top}' '' 'select-pane -U'
bind-key -T copy-mode-vi 'C-l' if -F '#{pane_at_right}' '' 'select-pane -R'

bind-key -n F1 select-window -t 1
bind-key -n F2 select-window -t 2
bind-key -n F3 select-window -t 3
bind-key -n F4 select-window -t 4
bind-key -n F5 select-window -t 5
bind-key -n F6 select-window -t 6
bind-key -n F7 select-window -t 7
bind-key -n F8 select-window -t 8
bind-key -n F9 select-window -t 9
bind-key -n F10 select-window -t 10
bind-key -n F11 select-window -t 11
bind-key -n F12 select-window -t 12
bind-key -n C-y resize-pane -Z

bind-key M copy-mode \; send -X search-backward "bmake"

bind r source-file ~/.tmux.conf

run-shell ~/.tmux/plugins/tmux-fingers/tmux-fingers.tmux

# From tmux-onedark-theme, just caching here for reference
# set "status-right" "〈 #[fg=$onedark_white,bg=$onedark_black,nounderscore,noitalics]${time_format} 〈 ${date_format} #[fg=$onedark_visual_grey,bg=$onedark_black]#[fg=$onedark_visual_grey,bg=$onedark_visual_grey]#[fg=$onedark_white, bg=$onedark_visual_grey]${status_widgets} #[fg=$onedark_green,bg=$onedark_visual_grey,nobold,nounderscore,noitalics]#[fg=$onedark_black,bg=$onedark_green,bold] #S #[fg=$onedark_yellow, bg=$onedark_green]#[fg=$onedark_red,bg=$onedark_yellow]"
# set "status-left" "#[fg=$onedark_black,bg=$onedark_green,bold] #{hostname} #{prefix_highlight}#[fg=$onedark_green,bg=$onedark_black,nobold,nounderscore,noitalics]"
# set "window-status-format" "#[fg=$onedark_black,bg=$onedark_black,nobold,nounderscore,noitalics]#[fg=$onedark_white,bg=$onedark_black] #I 〉#W #[fg=$onedark_black,bg=$onedark_black,nobold,nounderscore,noitalics]"
# set "window-status-current-format" "#[fg=$onedark_black,bg=$onedark_visual_grey,nobold,nounderscore,noitalics]#[fg=$onedark_white,bg=$onedark_visual_grey,nobold] #I 〉 #W #[fg=$onedark_visual_grey,bg=$onedark_black,nobold,nounderscore,noitalics]"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

run '~/.tmux/plugins/tpm/tpm'
